name: Word Search QA
on:
  push:
    paths:
      - "public/vocabulary-lab/games/word-search-visual-v1.html"
      - "public/vocabulary-lab/data/starter-dictionary-v1.json"
      - "scripts/test-word-search.mjs"
      - ".github/workflows/word-search-qa.yml"
  pull_request:
    paths:
      - "public/vocabulary-lab/games/word-search-visual-v1.html"
      - "public/vocabulary-lab/data/starter-dictionary-v1.json"
      - "scripts/test-word-search.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Word Search generator and vocabulary
        run: npm run test:word-search
